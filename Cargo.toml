[package]
name = "kascompute-service"
version = "0.5.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.37", features = ["macros","rt-multi-thread","signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

anyhow = "1.0"

[workspace]
members = ["testnet-launcher"]
resolver = "2"


